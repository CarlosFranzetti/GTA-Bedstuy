name: native

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [master]
    paths:
      - 'native/**'
      - '.github/workflows/native.yml'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            script: dist:mac
            name: mac-arm64
            paths: |
              native/release/*.dmg
              native/release/*.zip
          - os: windows-latest
            script: dist:win
            name: win-x64
            paths: |
              native/release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            native/package-lock.json

      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('native/package-lock.json') }}

      - name: Install web dependencies
        run: npm ci

      - name: Build hosted web bundle
        run: npm run build
        env:
          VITE_HOSTED: '1'

      - name: Install native dependencies
        run: npm --prefix native ci

      - name: Test native shell
        run: npm --prefix native test

      - name: Build desktop app (signing/notarization only if secrets are set)
        run: npm --prefix native run ${{ matrix.script }}
        env:
          # All optional. Empty values are ignored by electron-builder, giving an unsigned (mac: ad-hoc) build.
          CSC_LINK: ${{ matrix.os == 'macos-14' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-14' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: gta-bedstuy-${{ matrix.name }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.paths }}
          generate_release_notes: true
