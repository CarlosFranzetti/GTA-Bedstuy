@font-face{font-family:"Anton";src:url("../fonts/Anton-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Barlow Condensed";src:url("../fonts/BarlowCondensed-SemiBold.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Barlow Condensed";src:url("../fonts/BarlowCondensed-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
:root{--ink:#0a0910;--gold:#f2c230}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--ink)}
body{min-height:100vh;min-height:100svh;color:#fff;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;
 background:linear-gradient(to bottom,rgba(10,9,16,.7) 0,rgba(10,9,16,.45) 35%,rgba(10,9,16,.92) 75%,#0a0910 100%),url("../art/shot-avenue.webp") 55% 20%/cover no-repeat,var(--ink);
 display:flex;justify-content:center}
main{width:100%;max-width:520px;padding:max(40px,env(safe-area-inset-top)) 24px max(28px,env(safe-area-inset-bottom));display:flex;flex-direction:column;min-height:100vh;min-height:100svh}
.by{font-size:15px;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.9)}
h1{margin-top:auto;padding-top:80px;font-family:"Anton",sans-serif;font-weight:400;text-transform:uppercase;text-shadow:0 3px 22px rgba(0,0,0,.6)}
h1 .a{display:block;font-size:34px;line-height:1;letter-spacing:.34em;color:var(--gold);margin-bottom:10px}
h1 .b{display:block;font-size:clamp(72px,24vw,128px);line-height:.92}
.rule{height:5px;background:var(--gold);margin:12px 0 18px}
.what{font-size:24px;line-height:1.15;font-weight:700;text-shadow:0 2px 12px #000}
.sub{margin-top:8px;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700}
.btns{display:grid;gap:12px;margin-top:26px}
.btn{display:flex;align-items:center;justify-content:center;min-height:64px;padding:0 20px;border:3px solid #fff;text-decoration:none;font-family:"Anton",sans-serif;font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:rgba(6,6,10,.55);-webkit-tap-highlight-color:transparent}
.btn.play{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.btn:hover,.btn:focus-visible{background:#fff;border-color:#fff;color:var(--ink);outline:none}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.addr{margin-top:14px;text-align:center;font-size:17px;letter-spacing:.06em;color:rgba(255,255,255,.8)}
.disc{margin-top:22px;text-align:center;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.65)}
</style>

<main>

<p class="sub">Free · No install · Desktop and phone</p>

</nav>
<p class="addr">gta-bedstuy.vercel.app</p>
<p class="disc">A fan tribute. Not affiliated with Rockstar Games or Take-Two.</p>
</main>
