<!doctype html>
<html><head><meta charset="utf-8"><title>carcabin sheet</title>
<style>html,body{margin:0;background:#789;overflow:hidden}canvas{display:block}</style></head>
<body><script type="module">
// CARCABIN contact sheet: one row per vehicle type, three tiles: from the driver's seat, from behind and above (the chase view), and from the front
// above the windscreen. ?types=a,b,c &seeds=1 (seed per row, default 1) &tw= &th=. The result is one 2D canvas in window.__ready.
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Rng } from '@/core/Rng';
import { MaterialLibrary } from '@/textures/MaterialLibrary';
import { buildCarModel } from '@/entities/models/carModel';
import { VEHICLE_SPECS } from '@/entities/Vehicle';
import { lookFor } from '@/entities/models/carLook';
const q = new URLSearchParams(location.search);
const TW = Number(q.get('tw') ?? 360), TH = Number(q.get('th') ?? 210);
const types = (q.get('types') ?? '').split(',').filter(Boolean);
const seeds = (q.get('seeds') ?? '1').split(',').map(Number);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(TW, TH);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x8aa4bc);
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.5;
const sun = new THREE.DirectionalLight(0xfff2dc, 2.4); sun.position.set(-6, 10, 5); scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbfd8ff, 0x6a5a48, 0.8));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: 0x5a5d62, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
const materials = new MaterialLibrary(new Rng(7)); materials.carPaintDetail(); materials.setEnvironment(scene.environment);
const cam = new THREE.PerspectiveCamera(60, TW / TH, 0.05, 100);
const rows = types.length * seeds.length;
const sheet = document.createElement('canvas'); sheet.width = TW * 4; sheet.height = TH * rows;
const ctx = sheet.getContext('2d'); ctx.font = '13px sans-serif';
const info = [];
let row = 0;
for (const type of types) for (const seed of seeds) {
  const sp = VEHICLE_SPECS[type];
  const color = '#' + (sp.color ?? '#888888').replace('#', '');
  const lk = lookFor(type, color, seed);
  const m = buildCarModel(type, sp, materials, seed % 4, undefined, false, lk, seed);
  scene.add(m.group);
  const c = m.group.userData.cabin;
  let tris = 0, cabinTris = 0; m.group.traverse((o) => { if (o.isMesh && o.visible) { const g = o.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3 * (o.isInstancedMesh ? o.count : 1); } });
  if (c) { /* cabin triangles are counted by the test; here only the whole car */ }
  const H = sp.height, L = sp.length;
  const shots = [
    // from the driver's seat: head at the wheel's x, a little behind the wheel, looking forward and slightly down at the dash
    () => { cam.fov = 72; cam.position.set(c ? c.wheelX : -0.35, c ? c.seatY + 0.5 : H * 0.7, c ? c.wheelZ + 0.45 : 0); cam.lookAt(c ? c.wheelX * 0.3 : 0, c ? c.dashY - 0.12 : H * 0.6, c ? c.dashZ - 1.5 : -3); },
    // behind and above: roughly the chase camera looking down through the rear glass
    () => { cam.fov = 48; cam.position.set(0.5, H + 0.55, L * 0.5 + 1.1); cam.lookAt(0, H * 0.62, -L * 0.2); },
    // in front, above the bonnet, looking back through the windscreen
    () => { cam.fov = 48; cam.position.set(0.9, H + 0.6, -(L * 0.5 + 0.9)); cam.lookAt(0, H * 0.62, 0); },
    // x-ray: body, glass and hood hidden, so the cabin parts show; from behind and above, three-quarter
    () => { cam.fov = 44; const hide = []; m.group.traverse((o) => { if (o.isMesh && ['body', 'glass', 'hood', 'cargo'].includes(o.name)) { hide.push(o); o.visible = false; } }); window.__hide = hide; cam.position.set(1.3, H + 1.0, (c ? c.seatZ : 0) + 2.3); cam.lookAt(0, (c ? c.seatY : 0.8) + 0.3, (c ? c.dashZ : -1) + 0.9); },
  ];
  shots.forEach((fn, i) => {
    fn(); cam.updateProjectionMatrix();
    for (let k = 0; k < 2; k++) renderer.render(scene, cam);
    ctx.drawImage(renderer.domElement, i * TW, row * TH);
  });
  for (const o of window.__hide ?? []) o.visible = true; window.__hide = [];
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, row * TH, 260, 20);
  ctx.fillStyle = '#fff'; ctx.fillText(`${type} seed ${seed}  (${m.style})`, 6, row * TH + 14);
  info.push({ type, seed, style: m.style, tris });
  scene.remove(m.group);
  row++;
}
window.__ready = { info, data: sheet.toDataURL('image/png') };
</script></body></html>
