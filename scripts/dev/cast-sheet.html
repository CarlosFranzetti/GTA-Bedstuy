<!doctype html>
<html><head><meta charset="utf-8"><title>cast sheet</title>
<style>html,body{margin:0;background:#c9ced4;overflow:hidden}</style></head>
<body><script type="module">
// CAST seat: the named cast in a row (?cast=pedro:day,lana:day,... id:outfit). Copied from base-sheet.html (BASE seat); same query switches.
// BASE seat harness (round 3): bare or dressed people side by side, orthographic, any level of detail, arms raised.
// ?people=m:avg:adult,m:heavy:adult,f:pear:adult (sex:bodytype:age[:group]) &yaw=0 (front) | 3.1416 (back) | 1.5708 (side)
// &naked=1 (skin only, grey) &lod=hi|mid|far &arm=0 (deg the arms are raised out to the side) &seed=3 &w=1400 &h=720 &vh=2.15
// &zoom=x,y,h (centre x, y and the view height in metres, for close-ups) &wire=1
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Rng } from '@/core/Rng';
import { MaterialLibrary } from '@/textures/MaterialLibrary';
import { registerSpec } from '@/textures/painters/ped';
import { castSpec } from '@/game/story/cast/specs';
import { buildPerson, loadPeople, dressLod } from '@/entities/models/pedMesh';
import * as PM from '@/entities/models/pedMesh';
import { setPeopleMode } from '@/textures/painters/pedMode';
const q = new URLSearchParams(location.search);
// &stack=none | all | -arms,-torso | +legs (start from none) : the run-time deformers of pedMesh.bodyStack
if (q.get('stack')) { const st = q.get('stack').split(','); for (const k of PM.BODY_DEFORMERS) { if (st[0] === 'none' || st[0].startsWith('+')) PM.bodyStack[k] = false; if (st[0] === 'all') PM.bodyStack[k] = true; }
  for (const e of st) { if (e.startsWith('-')) PM.bodyStack[e.slice(1)] = false; if (e.startsWith('+')) PM.bodyStack[e.slice(1)] = true; } }
await loadPeople();
setPeopleMode('skin');
const W = Number(q.get('w') ?? 1400), H = Number(q.get('h') ?? 720);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); document.body.appendChild(renderer.domElement);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xc9ced4);
const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.55;
const yaw = Number(q.get('yaw') ?? 0);
const sun = new THREE.DirectionalLight(0xfff2dc, 2.2); sun.position.set(-4 * Math.cos(yaw) + 8 * Math.sin(yaw), 6, 8 * Math.cos(yaw) + 4 * Math.sin(yaw)); scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbfd8ff, 0x6a5a48, 0.6));
const materials = new MaterialLibrary(new Rng(7)); materials.carPaintDetail(); materials.setEnvironment(scene.environment);
const naked = q.get('naked') === '1', seed = Number(q.get('seed') ?? 3), lodQ = q.get('lod') ?? 'hi', arm = Number(q.get('arm') ?? 0) * Math.PI / 180;
const people = (q.get('cast') ?? 'pedro:day,lana:day,adele:day,stavros:day,akira:day').split(',');
const sp = Number(q.get('sp') ?? 0.9), info = [];
const grey = new THREE.MeshStandardMaterial({ color: 0xc9ad94, roughness: 0.75, wireframe: q.get('wire') === '1' });
people.forEach((e, i) => {
  const [cid, ok = 'day'] = e.split(':');
  const spec = castSpec(cid, ok);
  if (naked) spec.bottom = { ...spec.bottom, kind: 'shorts', cut: 'run' };
  const v = registerSpec(spec);
  const m = buildPerson(materials, new Rng(seed + i), { variant: v });
  m.group.position.set((i - (people.length - 1) / 2) * sp, 0, 0); m.group.rotation.y = Math.PI + yaw;
  { const s = arm || (m.group.userData.splay ?? 0); m.arms[0].rotation.z = -s; m.arms[1].rotation.z = s; }
  const lod = m.group.getObjectByName('pedLod'); lod.update = () => {};
  const k0 = Math.max(0, lod.levels.findIndex((l) => l.object.name === (lodQ === 'hi' ? 'body' : `body-${lodQ}`)));
  const shape = PM.shapeByName(m.group.userData.pedShape);
  if (naked) {
    const L = dressLod(shape, spec, shape.lods[lodQ], false);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(L.position, 3)); g.setAttribute('normal', new THREE.BufferAttribute(L.normal, 3));
    g.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(L.joints, 4)); g.setAttribute('skinWeight', new THREE.BufferAttribute(L.weights, 4)); g.setIndex(new THREE.BufferAttribute(L.index, 1));
    lod.levels.forEach((l, k) => { l.object.visible = k === k0; if (k === k0) { l.object.geometry = g; l.object.material = grey; } });
    info.push({ e, shape: shape.name, tris: L.index.length / 3 });
  } else {
    lod.levels.forEach((l, k) => { l.object.visible = k === k0; });
    info.push({ e, shape: shape.name, tris: lod.levels[k0].object.geometry.index.count / 3 });
  }
  scene.add(m.group);
});
const lineMat = new THREE.LineBasicMaterial({ color: 0x223344 });
const pts = []; const x0 = -(people.length / 2) * sp - 0.2;
for (let k = 0; k <= 20; k++) { const y = k * 0.1, len = k % 5 === 0 ? 0.16 : 0.07; pts.push(x0, y, 0, x0 + len, y, 0); }
pts.push(x0, 0, 0, x0, 2, 0);
scene.add(new THREE.LineSegments(new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(pts, 3)), lineMat));
let camH = Number(q.get('vh') ?? 2.15), cx = 0, cy = camH / 2 - 0.08;
if (q.get('zoom')) { const z = q.get('zoom').split(',').map(Number); cx = z[0]; cy = z[1]; camH = z[2]; }
const span = camH * W / H;
const cam = new THREE.OrthographicCamera(-span / 2, span / 2, camH / 2, -camH / 2, 0.1, 50); cam.position.set(cx, cy, 10); cam.lookAt(cx, cy, 0);
for (let i = 0; i < 3; i++) renderer.render(scene, cam);
window.__ready = { people: info, tris: renderer.info.render.triangles };
</script></body></html>
