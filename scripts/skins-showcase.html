<!doctype html>
<html><head><meta charset="utf-8"><title>skins showcase</title>
<style>html,body{margin:0;background:#789;overflow:hidden}</style></head>
<body><script type="module">
// Review harness for the SKINS lane: lines up every GTA3 person and every skinned car body (no game, no world).
// Dev server only: vite --port N, then /scripts/skins-showcase.html?view=peds|faces|cars|car4m&q=low|phone
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Rng } from '@/core/Rng';
import { MaterialLibrary } from '@/textures/MaterialLibrary';
import { PED_SPECS } from '@/entities/models/pedBody';
import { buildPedModel } from '@/entities/models/pedBodyHi';
import { animateWalk } from '@/entities/models/humanModel';
import { buildCarModel } from '@/entities/models/carModel';
import { VEHICLE_SPECS } from '@/entities/Vehicle';
import { CAR_COLORWAYS } from '@/textures/painters/vehicleSkin';

const params = new URLSearchParams(location.search);
const view = params.get('view') ?? 'peds';
const W = Number(params.get('w') ?? 1280), H = Number(params.get('h') ?? 720);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); document.body.appendChild(renderer.domElement);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8aa4bc);
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.5;
const sun = new THREE.DirectionalLight(0xfff2dc, 2.6); sun.position.set(-6, 10, 5); scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbfd8ff, 0x6a5a48, 0.7));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: 0x5a5d62, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
const materials = new MaterialLibrary(new Rng(7));
materials.carPaintDetail();
materials.setEnvironment(scene.environment);
const cam = new THREE.PerspectiveCamera(38, W / H, 0.1, 100);
const look = new THREE.Vector3();

if (view === 'peds' || view === 'faces' || view === 'walk' || view === 'group-front' || view === 'group-3q') {
  const n = PED_SPECS.length;
  const grp = view.startsWith('group');
  const cols = view === 'faces' || grp ? 6 : 10;
  const list = view === 'faces' || grp ? [0, 1, 2, 3, 5, 16] : Array.from({ length: n }, (_, i) => i);
  list.forEach((v, i) => {
    const m = buildPedModel(materials, new Rng(v + 1), { variant: v, heightScale: undefined });
    const row = Math.floor(i / cols), col = i % cols;
    m.group.position.set((col - (Math.min(cols, list.length) - 1) / 2) * (view === 'faces' ? 0.75 : grp ? 0.8 : 0.95), 0, -row * 1.3);
    m.group.rotation.y = Math.PI + (view === 'faces' ? 0 : grp ? (view === 'group-3q' ? 0.7 : 0.1 * (i % 3 - 1)) : (i % 3 - 1) * 0.35);
    if (view === 'walk') animateWalk(m, i * 0.9, 1);
    scene.add(m.group);
  });
  if (grp) { cam.position.set(view === 'group-3q' ? 2.8 : 0, 1.5, 4.0); look.set(0, 1.0, 0); cam.fov = 38; }
  else if (view === 'faces') { cam.position.set(0, 1.55, 3.4); look.set(0, 1.35, 0); cam.fov = 30; }
  else { cam.position.set(0, 1.6, 9.5); look.set(0, 0.85, -0.6); }
} else {
  const types = [['sedan', 0, 'sedan'], ['sedan', 3, 'coupe'], ['suv', 0, 'suv'], ['boxtruck', 0, 'van']];
  const sel = view === 'car4m' ? [[0, 0]] : null;
  types.forEach(([type, variant, key], r) => {
    const ways = CAR_COLORWAYS[key];
    ways.forEach((cw, c) => {
      if (sel && !(r === 0 && c === 0)) return;
      const spec = { ...VEHICLE_SPECS[type], color: cw.color };
      const m = buildCarModel(type, spec, materials, variant);
      m.group.position.set(view === 'car4m' ? 0 : (c - 1.5) * 3.4, 0, view === 'car4m' ? 0 : (r - 1.5) * 6.5);
      m.group.rotation.y = view === 'car4m' ? 0 : 0.5;
      scene.add(m.group);
    });
  });
  if (view === 'car4m') { cam.position.set(3.2, 1.5, 2.4); look.set(0, 0.7, 0); cam.fov = 50; }
  else { cam.position.set(9, 9, 15); look.set(0, 0.6, 0); cam.fov = 45; }
}
cam.updateProjectionMatrix(); cam.lookAt(look);
for (let i = 0; i < 3; i++) renderer.render(scene, cam);
window.__ready = { tris: renderer.info.render.triangles, calls: renderer.info.render.calls };
</script></body></html>
