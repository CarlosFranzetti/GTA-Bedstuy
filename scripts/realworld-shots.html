<!doctype html>
<html><head><meta charset="utf-8"><title>realworld shots</title>
<style>html,body{margin:0;background:#789;overflow:hidden}</style></head>
<body><script type="module">
// REALWORLD review harness (dev server only): builds the real-map world with the real pieces and renders the three owner frames.
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Rng } from '@/core/Rng';
import { MaterialLibrary } from '@/textures/MaterialLibrary';
import { buildRealWorld, measureWorld } from '@/world/roadnet/realWorld';
import { pointOnPath } from '@/world/roadnet/elReal';

const params = new URLSearchParams(location.search);
const W = Number(params.get('w') ?? 1280), H = Number(params.get('h') ?? 720);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); document.body.appendChild(renderer.domElement);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9db7cf);
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.5;
const sun = new THREE.DirectionalLight(0xfff2dc, 2.4); sun.position.set(-300, 500, 200); scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbfd8ff, 0x6a5a48, 0.8));
const materials = new MaterialLibrary(new Rng(7));
materials.setEnvironment(scene.environment);

const rw = await buildRealWorld({ materials, rng: new Rng(7), tier: 'high', warmMs: 0, streamRanges: { near: 200, far: 1e5 } });
scene.add(rw.group);
const out = {};
const settle = (cam) => { rw.streamer.settle(cam.position.x, cam.position.z, cam.position.y); rw.update(0, cam.position.x, cam.position.z, cam.position, false); };
const shot = (name, cam) => { renderer.render(scene, cam); out[name] = renderer.domElement.toDataURL('image/png'); };

// 1. top-down of the whole network (orthographic), with buildings and with roads only
{
  const b = rw.net.bounds, cx = (b.minX + b.maxX) / 2, cz = (b.minZ + b.maxZ) / 2;
  const spanX = b.maxX - b.minX + 200, spanZ = b.maxZ - b.minZ + 200;
  const half = Math.max(spanX / 2, (spanZ / 2) * (W / H));
  const cam = new THREE.OrthographicCamera(-half, half, half * (H / W), -half * (H / W), 1, 5000);
  cam.position.set(cx, 2000, cz); cam.up.set(0, 0, -1); cam.lookAt(cx, 0, cz);
  rw.streamer.update(cx, cz, 0, 0); // far boxes for the whole map (far range is unlimited here), one near chunk
  const blds = rw.group.children.filter((c) => c.name !== 'roads-real' && c.name !== 'ground-real');
  blds.forEach((o) => { o.visible = false; });
  shot('top-roads', cam);
  blds.forEach((o) => { o.visible = true; });
  shot('top-all', cam);
}
// 2. under the el on Broadway: on the JZ path between Myrtle and Kosciuszko, looking along it
{
  const jz = rw.el.paths.find((p) => p.id === 'JZ');
  const st = rw.el.stations.filter((s) => s.path === 'JZ');
  const s = (st.find((x) => x.id === 'myrtle').s + st.find((x) => x.id === 'kosciuszko').s) / 2 - 120;
  const c = pointOnPath(jz, s);
  const cam = new THREE.PerspectiveCamera(70, W / H, 0.1, 1500);
  cam.position.set(c.p.x - c.dir.x * 20, 1.7, c.p.z - c.dir.z * 20);
  cam.lookAt(c.p.x + c.dir.x * 60, 5.5, c.p.z + c.dir.z * 60);
  settle(cam);
  let bestT = 0, bestD = 1e9;
  for (let t = 0; t < 700; t += 2) {
    rw.trains.time = t; rw.trains.update(0, cam.position, false);
    for (const tr of rw.trains.trains) for (const car of tr.cars) if (car.group.visible) {
      const d = Math.hypot(car.group.position.x - c.p.x, car.group.position.z - c.p.z);
      if (d < bestD) { bestD = d; bestT = t; }
    }
  }
  rw.trains.time = bestT; rw.trains.update(0, cam.position, false);
  out.trainInfo = { t: bestT, dist: Math.round(bestD) };
  shot('under-el-broadway', cam);
}
// 3. a bent residential street near the spawn: the node where two edges of one street meet at the sharpest angle within 900 m
{
  const net = rw.net;
  const outDir = (e, v) => { const E = net.edges[e]; const fwd = E.a === v; const p0 = fwd ? E.pts[0] : E.pts[E.pts.length - 1]; const p1 = fwd ? E.pts[1] : E.pts[E.pts.length - 2]; const l = Math.hypot(p1.x - p0.x, p1.z - p0.z) || 1; return { x: (p1.x - p0.x) / l, z: (p1.z - p0.z) / l }; };
  let best = null;
  net.nodes.forEach((n, v) => {
    if (Math.hypot(n.p.x - rw.spawn.x, n.p.z - rw.spawn.z) > 900) return;
    const inc = net.incident[v];
    for (let i = 0; i < inc.length; i++) for (let j = i + 1; j < inc.length; j++) {
      const A = net.edges[inc[i]], B = net.edges[inc[j]];
      if (A.name !== B.name || A.name === 'Broadway' || A.level !== 0 || net.lengths[inc[i]] < 40 || net.lengths[inc[j]] < 40) continue;
      const d1 = outDir(inc[i], v), d2 = outDir(inc[j], v);
      const defl = Math.PI - Math.acos(Math.max(-1, Math.min(1, d1.x * d2.x + d1.z * d2.z)));
      if (defl > 0.12 && (!best || defl > best.defl)) best = { defl, v, d1, d2, name: A.name };
    }
  });
  const n = net.nodes[best.v].p;
  const cam = new THREE.PerspectiveCamera(65, W / H, 0.1, 1500);
  cam.position.set(n.x + best.d1.x * 35, 1.7, n.z + best.d1.z * 35);
  cam.lookAt(n.x + best.d2.x * 30, 3, n.z + best.d2.z * 30);
  out.bentInfo = { name: best.name, deg: Math.round((best.defl * 180) / Math.PI) };
  settle(cam);
  shot('bent-street', cam);
}
{
  const w = rw.lots.filter((l) => l.wedge).sort((a, b) => Math.hypot(a.frontA.x - rw.spawn.x, a.frontA.z - rw.spawn.z) - Math.hypot(b.frontA.x - rw.spawn.x, b.frontA.z - rw.spawn.z))[0];
  if (w) {
    const cx = (w.frontA.x + w.frontB.x) / 2, cz = (w.frontA.z + w.frontB.z) / 2;
    const cam = new THREE.PerspectiveCamera(65, W / H, 0.1, 1500);
    cam.position.set(cx + w.outward.x * 38, 1.7, cz + w.outward.z * 38);
    cam.lookAt(cx, 4, cz);
    settle(cam);
    out.wedgeInfo = { id: w.id, at: [Math.round(cx), Math.round(cz)] };
    shot('wedge-corner', cam);
  }
}
window.__ready = { shots: out, standIns: rw.standIns, stats: rw.stats, bent: out.bentInfo, train: out.trainInfo, wedge: out.wedgeInfo, badBlocks: rw.badBlocks, streamer: rw.streamer.stats(), info: renderer.info.render };
</script></body></html>
