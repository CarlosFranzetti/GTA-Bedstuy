<!doctype html>
<html><head><meta charset="utf-8"><title>realworld shots</title>
<style>html,body{margin:0;background:#789;overflow:hidden}</style></head>
<body><script type="module">
// REALWORLD review harness (dev server only): builds the real-map world with the real pieces and renders the three owner frames.
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Rng } from '@/core/Rng';
import { MaterialLibrary } from '@/textures/MaterialLibrary';
import { buildRealWorld, measureWorld } from '@/world/roadnet/realWorld';
import { pointOnPath } from '@/world/roadnet/elReal';
import { setLampsLit } from '@/world/FurnitureGen';
import { NightLights } from '@/render/NightLights';

const params = new URLSearchParams(location.search);
const W = Number(params.get('w') ?? 1280), H = Number(params.get('h') ?? 720);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); document.body.appendChild(renderer.domElement);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9db7cf);
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.5;
const sun = new THREE.DirectionalLight(0xfff2dc, 2.4); sun.position.set(-300, 500, 200); scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbfd8ff, 0x6a5a48, 0.8));
const materials = new MaterialLibrary(new Rng(7));
materials.setEnvironment(scene.environment);

const rw = await buildRealWorld({ materials, rng: new Rng(7), tier: params.get('tier') ?? 'high', warmMs: 0, streamRanges: { near: 200, far: 1e5 } });
scene.add(rw.group);
const out = {};
const hemi = scene.children.find((c) => c.isHemisphereLight);
const night = new NightLights(scene, rw.lamps);
// dusk(true): dim sky and sun, lamps lit, night light pool around the camera; dusk(false): the day look
const dusk = (on, cam) => {
  scene.background = new THREE.Color(on ? 0x1b2338 : 0x9db7cf);
  sun.intensity = on ? 0.35 : 2.4; hemi.intensity = on ? 0.22 : 0.8; scene.environmentIntensity = on ? 0.12 : 0.5;
  setLampsLit(rw.furnitureGroup, on);
  if (cam) night.update({ x: cam.position.x, z: cam.position.z }, on, 1);
};
// triangles and draws of one street frame (info is reset by each render call)
const info = {};
const frameInfo = (name) => { info[name] = { triangles: renderer.info.render.triangles, calls: renderer.info.render.calls }; };
const settle = (cam) => { rw.streamer.settle(cam.position.x, cam.position.z, cam.position.y); rw.update(0, cam.position.x, cam.position.z, cam.position, false); };
const shot = (name, cam) => { renderer.render(scene, cam); frameInfo(name); out[name] = renderer.domElement.toDataURL('image/png'); };

// 1. top-down of the whole network (orthographic), with buildings and with roads only
{
  const b = rw.net.bounds, cx = (b.minX + b.maxX) / 2, cz = (b.minZ + b.maxZ) / 2;
  const spanX = b.maxX - b.minX + 200, spanZ = b.maxZ - b.minZ + 200;
  const half = Math.max(spanX / 2, (spanZ / 2) * (W / H));
  const cam = new THREE.OrthographicCamera(-half, half, half * (H / W), -half * (H / W), 1, 5000);
  cam.position.set(cx, 2000, cz); cam.up.set(0, 0, -1); cam.lookAt(cx, 0, cz);
  rw.streamer.update(cx, cz, 0, 0); // far boxes for the whole map (far range is unlimited here), one near chunk
  const blds = rw.group.children.filter((c) => c.name !== 'roads-real' && c.name !== 'ground-real');
  blds.forEach((o) => { o.visible = false; });
  shot('top-roads', cam);
  blds.forEach((o) => { o.visible = true; });
  shot('top-all', cam);
  { let vis = 0, tot = 0; rw.streamer.root.traverse((o) => { if (o.isMesh) { tot++; if (o.visible) vis++; } }); out.topInfo = { vis, tot, tris: renderer.info.render.triangles, calls: renderer.info.render.calls, rootVisible: rw.streamer.root.visible, parentVisible: rw.group.visible }; }
}
if (params.get('only') === 'top') { window.__ready = { shots: out, top: out.topInfo, standIns: rw.standIns, stats: rw.stats, info: renderer.info.render }; throw new Error('only top'); }
// 2. under the el on Broadway: on the JZ path between Myrtle and Kosciuszko, looking along it
{
  const jz = rw.el.paths.find((p) => p.id === 'JZ');
  const st = rw.el.stations.filter((s) => s.path === 'JZ');
  const s = (st.find((x) => x.id === 'myrtle').s + st.find((x) => x.id === 'kosciuszko').s) / 2 - 120;
  const c = pointOnPath(jz, s);
  const cam = new THREE.PerspectiveCamera(70, W / H, 0.1, 1500);
  const lat = { x: -c.dir.z, z: c.dir.x };
  cam.position.set(c.p.x - c.dir.x * 34 + lat.x * 9, 1.7, c.p.z - c.dir.z * 34 + lat.z * 9);
  cam.lookAt(c.p.x + lat.x * 1, 9, c.p.z + lat.z * 1);
  settle(cam);
  let bestT = 0, bestD = 1e9;
  for (let t = 0; t < 700; t += 2) {
    rw.trains.time = t; rw.trains.update(0, cam.position, false);
    for (const tr of rw.trains.trains) for (const car of tr.cars) if (car.group.visible) {
      const d = Math.hypot(car.group.position.x - c.p.x, car.group.position.z - c.p.z);
      if (d < bestD) { bestD = d; bestT = t; }
    }
  }
  rw.trains.time = bestT; rw.trains.update(0, cam.position, true);
  { const car = rw.trains.trains.flatMap((tr) => tr.cars).find((k) => k.group.visible && Math.hypot(k.group.position.x - c.p.x, k.group.position.z - c.p.z) < 12); if (car) { const q = car.group.position; cam.lookAt(q.x, q.y, q.z); } }
  out.trainInfo = { t: bestT, dist: Math.round(bestD) };
  dusk(true, cam);
  shot('under-el-broadway', cam);
  dusk(false);
}
// 3. a residential street: a straight side street 90-200 m long within 500 m of the spawn and at least 80 m from the el
{
  const net = rw.net;
  const elPts = []; for (const pth of rw.el.paths) for (let q = 0; q < pth.length; q += 25) elPts.push(pointOnPath(pth, q).p);
  let best = null;
  net.edges.forEach((E, e) => {
    const L = net.lengths[e];
    if (E.level !== 0 || L < 90 || L > 200 || E.width > 14 || /broadway|myrtle|flushing/i.test(E.name)) return;
    const m = { x: (E.pts[0].x + E.pts[1].x) / 2, z: (E.pts[0].z + E.pts[1].z) / 2 };
    if (Math.hypot(E.pts[1].x - E.pts[0].x, E.pts[1].z - E.pts[0].z) < 60) return;
    const d = Math.hypot(m.x - rw.spawn.x, m.z - rw.spawn.z);
    if (d > 700 || elPts.some((p) => Math.hypot(p.x - m.x, p.z - m.z) < 40)) return;
    if (!best || d < best.d) best = { d, e, m, E };
  });
  const E = best.E, dx = E.pts[1].x - E.pts[0].x, dz = E.pts[1].z - E.pts[0].z, l = Math.hypot(dx, dz);
  const dir = { x: dx / l, z: dz / l };
  const cam = new THREE.PerspectiveCamera(65, W / H, 0.1, 1500);
  const lat = { x: -dir.z, z: dir.x };
  cam.position.set(E.pts[0].x + dir.x * 22 + lat.x * (E.width / 2 - 1.5), 1.7, E.pts[0].z + dir.z * 22 + lat.z * (E.width / 2 - 1.5));
  cam.lookAt(E.pts[0].x + dir.x * 70 - lat.x * 3, 3, E.pts[0].z + dir.z * 70 - lat.z * 3);
  out.bentInfo = { name: E.name, len: Math.round(l) };
  settle(cam);
  dusk(false);
  shot('residential-street', cam);
}
{
  // a shop sign: the POI lot nearest the spawn, seen from the street 16 m out, a little to the side
  const pl = rw.lots.filter((l) => l.poi).sort((p, q) => Math.hypot(p.frontA.x - rw.spawn.x, p.frontA.z - rw.spawn.z) - Math.hypot(q.frontA.x - rw.spawn.x, q.frontA.z - rw.spawn.z));
  const w = pl[0];
  if (w) {
    const cx = (w.frontA.x + w.frontB.x) / 2, cz = (w.frontA.z + w.frontB.z) / 2;
    const cam = new THREE.PerspectiveCamera(65, W / H, 0.1, 1500);
    const al = { x: w.frontB.x - w.frontA.x, z: w.frontB.z - w.frontA.z }; const l = Math.hypot(al.x, al.z) || 1;
    cam.position.set(cx + w.outward.x * 16 + (al.x / l) * 8, 1.7, cz + w.outward.z * 16 + (al.z / l) * 8);
    cam.lookAt(cx, 3.2, cz);
    settle(cam);
    out.shopInfo = { id: w.id, poi: w.poi.id, sign: w.poi.sign, at: [Math.round(cx), Math.round(cz)], poiLots: pl.length };
    dusk(false);
    shot('shop-corner', cam);
  }
}
window.__ready = { shots: out, standIns: rw.standIns, stats: rw.stats, bent: out.bentInfo, top: out.topInfo, train: out.trainInfo, shop: out.shopInfo, frames: info, tier: params.get('tier') ?? 'high', home: rw.homeSpawn, lamps: rw.lamps.length, props: rw.props && rw.props.stats, badBlocks: rw.badBlocks, streamer: rw.streamer.stats(), info: renderer.info.render };
</script></body></html>
