<!doctype html>
<html><head><meta charset="utf-8"><title>people showcase</title>
<style>html,body{margin:0;background:#789;overflow:hidden}</style></head>
<body><script type="module">
// Review harness for the SKINS lane: lines up every GTA3 person and every skinned car body (no game, no world).
// Dev server only: vite --port N, then /scripts/skins-showcase.html?view=peds|faces|cars|car4m&q=low|phone
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Rng } from '@/core/Rng';
import { MaterialLibrary } from '@/textures/MaterialLibrary';
import { PED_SPECS } from '@/entities/models/pedBody';
import { buildPerson as buildPedModel, loadPeople } from '@/entities/models/pedMesh';
import { pedVariantIndex } from '@/textures/painters/ped';
import { paintPedHi } from '@/textures/painters/pedHi';
await loadPeople();
import { animateWalk } from '@/entities/models/humanModel';
import { buildCarModel } from '@/entities/models/carModel';
import { VEHICLE_SPECS } from '@/entities/Vehicle';
import { CAR_COLORWAYS } from '@/textures/painters/vehicleSkin';

const params = new URLSearchParams(location.search);
const view = params.get('view') ?? 'peds';
const W = Number(params.get('w') ?? 1280), H = Number(params.get('h') ?? 720);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); document.body.appendChild(renderer.domElement);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8aa4bc);
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.5;
const sun = new THREE.DirectionalLight(0xfff2dc, 2.6); sun.position.set(-6, 10, 5); scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbfd8ff, 0x6a5a48, 0.7));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: 0x5a5d62, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
const materials = new MaterialLibrary(new Rng(7));
materials.carPaintDetail();
materials.setEnvironment(scene.environment);
const cam = new THREE.PerspectiveCamera(38, W / H, 0.1, 100);
const look = new THREE.Vector3();

const LINE_A = ['ba-hoodie-fade', 'ba-jersey-teen', 'ca-tracksuit', 'ea-nurse', 'wh-office', 'mx-office'];
const LINE_B = ['ea-office', 'me-tracksuit', 'hj-man', 'me-hijabi', 'ba-puffer-braids', 'wh-elder'];
const LINE_C = ['la-construction', 'ca-headwrap', 'wh-elder', 'ea-nurse', 'ba-church-man', 'sa-hijabi'];
const place = (ids, row, spacing, yaw) => {
  ids.forEach((id, i) => {
    const v = pedVariantIndex(id);
    const m = buildPedModel(materials, new Rng(v + 1), { variant: v });
    m.group.position.set((i - (ids.length - 1) / 2) * spacing + row * spacing * 0.5, 0, -row * 1.6);
    m.group.rotation.y = Math.PI + yaw + 0.08 * ((i % 3) - 1);
    scene.add(m.group);
  });
};
if (view === 'lineup') { place(LINE_A, 0, 1.05, 0); place(LINE_B, 1, 1.05, 0); cam.position.set(0, 2.4, 7.2); look.set(0, 0.9, -0.8); cam.fov = 36; }
else if (view === 'lineup-3q') { place(LINE_A, 0, 0.9, 0.7); place(LINE_B, 1, 0.9, 0.7); cam.position.set(3.2, 1.5, 6.0); look.set(0, 0.95, -0.6); cam.fov = 36; }
else if (view === 'faces-a') { place(LINE_A, 0, 0.62, 0); cam.position.set(0, 1.62, 2.6); look.set(0, 1.5, 0); cam.fov = 30; }
else if (view === 'faces-b') { place(LINE_B, 0, 0.62, 0); cam.position.set(0, 1.62, 2.6); look.set(0, 1.5, 0); cam.fov = 30; }
else if (view === 'faces-c') { place(LINE_C, 0, 0.62, 0); cam.position.set(0, 1.62, 2.6); look.set(0, 1.5, 0); cam.fov = 30; }
else if (view === 'close-a') { place(['ba-hoodie-fade', 'ea-nurse', 'wh-elder'], 0, 0.5, 0); cam.position.set(0, 1.64, 1.25); look.set(0, 1.6, 0); cam.fov = 30; }
else if (view === 'close-b') { place(['ba-church-man', 'me-hijabi', 'wh-office'], 0, 0.5, 0.0); cam.position.set(0, 1.64, 1.25); look.set(0, 1.6, 0); cam.fov = 30; }
else if (view === 'full-c') { place(LINE_C, 0, 0.8, 0.3); cam.position.set(0, 1.4, 4.2); look.set(0, 0.95, 0); cam.fov = 36; }
else if (view === 'near4m') { place(LINE_A.slice(0, 3), 0, 1.0, 0.4); cam.position.set(1.7, 1.5, 3.6); look.set(0, 1.0, 0); cam.fov = 38; }
const OUT_A = ['ba-transit', 'la-site', 'ba-denim-open', 'sa-bomber', 'wh-coat', 'ba-sundress'];
const OUT_B = ['ca-shorts', 'ea-breton', 'wh-flannel', 'sa-masked', 'ea-site', 'hj-boy'];
if (view === 'outfits-a') { place(OUT_A, 0, 0.95, 0.15); cam.position.set(0.3, 1.45, 5.6); look.set(0, 0.95, 0); cam.fov = 34; }
else if (view === 'outfits-b') { place(OUT_B, 0, 0.95, 0.15); cam.position.set(0.3, 1.45, 5.6); look.set(0, 0.95, 0); cam.fov = 34; }
else if (view === 'outfits-c') { place(['ba-hoodie-fade', 'la-delivery', 'wh-puffer-braids'.replace('wh', 'ba'), 'ca-tracksuit', 'ba-jersey-teen', 'wh-cyclist'], 0, 0.95, -0.25); cam.position.set(-0.4, 1.45, 5.6); look.set(0, 0.95, 0); cam.fov = 34; }
else if (view === 'hijab') { place(['me-hijabi', 'sa-hijabi'], 0, 0.7, 0.45); cam.position.set(0.9, 1.5, 2.2); look.set(0, 1.35, 0); cam.fov = 30; }
else if (view === 'shoulder') { place(['ba-hoodie-fade', 'ba-denim-open', 'ba-transit'], 0, 0.62, 0.8); cam.position.set(1.6, 1.5, 1.3); look.set(0, 1.35, 0); cam.fov = 30; }
else if (view === 'legs') { place(['ba-denim-open', 'ca-shorts', 'la-site', 'ba-sundress'], 0, 0.7, 0.5); cam.position.set(1.3, 0.55, 2.4); look.set(0, 0.5, 0); cam.fov = 34; }
else if (view === 'hands') { place(['ba-hoodie-fade', 'wh-coat', 'ba-sundress'], 0, 0.55, 0.9); cam.position.set(1.2, 1.0, 1.5); look.set(0, 0.95, 0); cam.fov = 28; }
if (view === 'atlas') {
  const c = document.createElement('canvas'); c.width = c.height = 1024; document.body.prepend(c);
  const ctx = c.getContext('2d'); const v = pedVariantIndex(params.get('v') ?? 'ba-hoodie-fade');
  paintPedHi(ctx, null, null, 1024, new Rng(`pedhi:${v}`), v);
}
cam.updateProjectionMatrix(); cam.lookAt(look);
for (let i = 0; i < 3; i++) renderer.render(scene, cam);
window.__ready = { tris: renderer.info.render.triangles, calls: renderer.info.render.calls };
</script></body></html>
