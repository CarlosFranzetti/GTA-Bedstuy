<!doctype html>
<html><head><meta charset="utf-8"><title>cars12 sheet</title>
<style>html,body{margin:0;background:#789;overflow:hidden}</style></head>
<body><script type="module">
// CARS12 review sheet: many cars, several angles each, ONE page (one shader compile). ?cars=type:color:seed:ov;... &angles=front3q,rear3q&w=&h=&dist=
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Rng } from '@/core/Rng';
import { MaterialLibrary } from '@/textures/MaterialLibrary';
import { buildCarModel } from '@/entities/models/carModel';
import { VEHICLE_SPECS } from '@/entities/Vehicle';
import { lookFor } from '@/entities/models/carLook';
const params = new URLSearchParams(location.search);
const W = Number(params.get('w') ?? 800), H = Number(params.get('h') ?? 450);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); document.body.appendChild(renderer.domElement);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x8aa4bc);
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.5;
const sun = new THREE.DirectionalLight(0xfff2dc, 2.6); sun.position.set(-6, 10, 5); scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbfd8ff, 0x6a5a48, 0.7));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: 0x5a5d62, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
const materials = new MaterialLibrary(new Rng(7)); materials.carPaintDetail(); materials.setEnvironment(scene.environment);
const cam = new THREE.PerspectiveCamera(46, W / H, 0.1, 100); const look = new THREE.Vector3();
const angles = (params.get('angles') ?? 'front3q,rear3q').split(',');
const AN = { front3q: Math.PI + 0.6, side: Math.PI / 2, rear3q: 0.6, front: Math.PI, rear: 0, high3q: Math.PI + 0.55, highside: Math.PI * 0.5 + 0.0 };
const out = [];
for (const spec of (params.get('cars') ?? '').split(';').filter(Boolean)) {
  const [type, colorRaw, seedS = '', ov = '', distS = ''] = spec.split(':');
  const color = '#' + colorRaw; const seed = seedS === '' ? 0 : Number(seedS);
  let lk;
  if (seedS !== '') {
    lk = lookFor(type, color, seed);
    for (const kv of ov.split('|').filter(Boolean)) { const [k, v] = kv.split('~'); lk[k] = k === 'stickers' ? v.split('.').filter(Boolean).map(Number) : v === 'true' ? true : v === 'false' ? false : isNaN(Number(v)) ? v : Number(v); }
    lk.condKey = `${lk.dirt}.${lk.rust}.${lk.dents}.${lk.primer}.${seed & 7}`;
  }
  const m = buildCarModel(type, { ...VEHICLE_SPECS[type], color }, materials, 0, undefined, false, lk, seed);
  scene.add(m.group);
  const sp = VEHICLE_SPECS[type];
  const dist = distS !== '' ? Number(distS) : Math.max(5, sp.length * 1.05 + sp.height * 0.6);
  let tris = 0; m.group.traverse((o) => { if (o.isMesh && o.visible) { const g = o.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3 * (o.isInstancedMesh ? o.count : 1); } });
  for (const an of angles) {
    const a = AN[an];
    const hi = an === 'high3q'; cam.position.set(Math.sin(a) * dist * (hi ? 0.8 : 1), hi ? sp.height + 2.2 : Math.max(1.3, sp.height * 0.8 + 0.2), Math.cos(a) * dist * (hi ? 0.8 : 1)); look.set(0, sp.height * (hi ? 0.7 : 0.4), 0);
    cam.lookAt(look);
    for (let i = 0; i < 2; i++) renderer.render(scene, cam);
    out.push({ name: `${type}-${colorRaw}-s${seedS}-${an}`, tris, style: m.style, data: renderer.domElement.toDataURL('image/png') });
  }
  scene.remove(m.group);
}
window.__ready = out;
</script></body></html>
